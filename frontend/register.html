<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARU HRMS - Register</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .register-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            padding: 20px;
            box-sizing: border-box;
        }

        .register-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .register-box h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="register-container">

        <div class="register-box">

            <h1>ARU HRMS</h1>

            <p class="subtitle">
                Create your employee account
            </p>


            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMPLOYEE ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Example: EMP004"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="Human Resources">
                            Human Resources
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Operations">
                            Operations
                        </option>

                    </select>

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <select
                        id="role"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="HR Manager">
                            HR Manager
                        </option>

                        <option value="Software Developer">
                            Software Developer
                        </option>

                        <option value="Tester">
                            Tester
                        </option>

                        <option value="Accountant">
                            Accountant
                        </option>

                        <option value="Designer">
                            Designer
                        </option>

                        <option value="Intern">
                            Intern
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


                <p id="message"></p>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script>

        const API_URL =
            "http://localhost:3000";


        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const employeeId =
                    document.getElementById(
                        "employeeId"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const department =
                    document.getElementById(
                        "department"
                    ).value;


                const role =
                    document.getElementById(
                        "role"
                    ).value;


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                // Check password

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                message.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/register`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    name:
                                        name,

                                    employeeId:
                                        employeeId,

                                    email:
                                        email,

                                    department:
                                        department,

                                    role:
                                        role,

                                    password:
                                        password

                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        message.textContent =
                            "Registration successful! Redirecting...";


                        registerForm.reset();


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1200
                        );


                    } else {

                        message.textContent =
                            data.message ||
                            "Registration failed.";

                    }


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Backend connection failed. Please start the server.";

                }

            }
        );

    </script>

</body>

</html>
