<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARU HRMS - Notifications</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 15px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            margin: 0;
        }

        .logo span {
            color: #60a5fa;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-menu a {
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #2563eb;
            color: white;
        }

        .logout {
            margin-top: 25px;
            color: #f87171 !important;
        }

        .main {
            flex: 1;
            padding: 30px;
            box-sizing: border-box;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-header p {
            color: #6b7280;
        }

        .notification-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            border-left: 4px solid #2563eb;
        }

        .notification-card.unread {
            background: #eff6ff;
        }

        .notification-title {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .notification-message {
            color: #4b5563;
            line-height: 1.5;
        }

        .notification-time {
            margin-top: 10px;
            color: #9ca3af;
            font-size: 12px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }

        @media (max-width: 700px) {

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
            }

            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .nav-menu a {
                white-space: nowrap;
            }

            .main {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                ARU <span>HRMS</span>
            </h2>

        </div>


        <nav class="nav-menu">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="employees.html">
                👥 Employees
            </a>

            <a href="profile.html">
                👤 Profile
            </a>

            <a
                href="notifications.html"
                class="active"
            >
                🔔 Notifications
            </a>

            <a href="index.html">
                🏠 Home
            </a>

            <a
                href="login.html"
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-header">

            <h1>
                Notifications 🔔
            </h1>

            <p>
                Stay updated with HRMS activities.
            </p>

        </div>


        <div id="notificationsContainer">

            <div class="empty">
                Loading notifications...
            </div>

        </div>


        <p
            id="errorMessage"
            class="error"
        ></p>

    </main>

</div>


<script>

    const API_URL =
        "http://localhost:3000";


    async function loadNotifications() {

        const container =
            document.getElementById(
                "notificationsContainer"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/api/notifications`
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to load notifications"
                );

            }


            const notifications =
                data.notifications || [];


            container.innerHTML = "";


            if (notifications.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No notifications available.
                    </div>
                `;

                return;

            }


            notifications.forEach(
                notification => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "notification-card";


                    if (
                        notification.is_read === 0 ||
                        notification.is_read === false
                    ) {

                        card.classList.add(
                            "unread"
                        );

                    }


                    card.innerHTML = `

                        <div class="notification-title">
                            🔔 ${notification.title}
                        </div>

                        <div class="notification-message">
                            ${notification.message}
                        </div>

                        <div class="notification-time">
                            ${formatDate(notification.created_at)}
                        </div>

                    `;


                    container.appendChild(card);

                }
            );


        } catch (error) {

            console.error(error);


            container.innerHTML = `
                <div class="empty">
                    Unable to load notifications.
                </div>
            `;


            document.getElementById(
                "errorMessage"
            ).textContent =
                "Backend connection failed. Please start the server.";

        }

    }


    function formatDate(dateValue) {

        if (!dateValue) {
            return "Recently";
        }


        const date =
            new Date(dateValue);


        if (isNaN(date.getTime())) {
            return dateValue;
        }


        return date.toLocaleString(
            "en-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    }


    function logout() {

        localStorage.removeItem(
            "aruLoggedInEmployee"
        );

    }


    loadNotifications();

</script>

</body>

</html>
