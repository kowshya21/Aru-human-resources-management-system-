<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ARU HRMS</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f7f8fc;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e5e6ef;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(35, 38, 80, 0.12);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .login-logo h1 span {
            color: #5b5ce2;
        }

        .login-logo p {
            color: #777a87;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dfe0e8;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #5b5ce2;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #5b5ce2;
            font-weight: 700;
            cursor: pointer;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #5b5ce2;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-submit:hover {
            background: #4445c7;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #777a87;
        }

        .register-link a {
            color: #5b5ce2;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            margin
