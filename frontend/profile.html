<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARU HRMS - Profile</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 15px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            margin: 0;
        }

        .logo span {
            color: #60a5fa;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-menu a {
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #2563eb;
            color: white;
        }

        .logout {
            margin-top: 25px;
            color: #f87171 !important;
        }

        .main {
            flex: 1;
            padding: 30px;
            box-sizing: border-box;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-title p {
            color: #6b7280;
        }

        .profile-card {
            max-width: 800px;
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
        }

        .profile-header h2 {
            margin: 0 0 7px;
        }

        .profile-header p {
            margin: 0;
            color: #6b7280;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .detail-box {
            background: #f9fafb;
            padding: 17px;
            border-radius: 9px;
        }

        .detail-box label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .detail-box span {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
            }

            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .nav-menu a {
                white-space: nowrap;
            }

            .main {
                padding: 18px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                ARU <span>HRMS</span>
            </h2>

        </div>


        <nav class="nav-menu">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="employees.html">
                👥 Employees
            </a>

            <a
                href="profile.html"
                class="active"
            >
                👤 Profile
            </a>

            <a href="notifications.html">
                🔔 Notifications
            </a>

            <a href="index.html">
                🏠 Home
            </a>

            <a
                href="login.html"
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-title">

            <h1>
                My Profile
            </h1>

            <p>
                View your employee information
            </p>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Loading profile...
        </div>


        <div
            id="profileCard"
            class="profile-card"
            style="display:none;"
        >

            <div class="profile-header">

                <div
                    id="avatar"
                    class="avatar"
                >
                    E
                </div>

                <div>

                    <h2 id="profileName">
                        Employee
                    </h2>

                    <p id="profileRole">
                        Employee
                    </p>

                </div>

            </div>


            <div class="details">


                <div class="detail-box">

                    <label>
                        Employee ID
                    </label>

                    <span id="profileId">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Full Name
                    </label>

                    <span id="profileFullName">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Email
                    </label>

                    <span id="profileEmail">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Phone
                    </label>

                    <span id="profilePhone">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Department
                    </label>

                    <span id="profileDepartment">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Role
                    </label>

                    <span id="profileRoleDetail">
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <label>
                        Status
                    </label>

                    <span
                        id="profileStatus"
                        class="status"
                    >
                        -
                    </span>

                </div>


            </div>

        </div>


        <div
            id="errorMessage"
            class="error"
            style="display:none;"
        ></div>

    </main>

</div>


<script>

    const API_URL =
        "http://localhost:3000";


    async function loadProfile() {

        const savedEmployee =
            localStorage.getItem(
                "aruLoggedInEmployee"
            );


        if (!savedEmployee) {

            window.location.href =
                "login.html";

            return;

        }


        try {

            const employee =
                JSON.parse(savedEmployee);


            const response =
                await fetch(
                    `${API_URL}/api/employees/${employee.employee_id}`
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to load profile"
                );

            }


            const profile =
                data.employee;


            // Name

            document.getElementById(
                "profileName"
            ).textContent =
                profile.name;


            document.getElementById(
                "profileFullName"
            ).textContent =
                profile.name;


            // Avatar

            const firstLetter =
                profile.name
                    .charAt(0)
                    .toUpperCase();


            document.getElementById(
                "avatar"
            ).textContent =
                firstLetter;


            // Employee ID

            document.getElementById(
                "profileId"
            ).textContent =
                profile.employee_id;


            // Email

            document.getElementById(
                "profileEmail"
            ).textContent =
                profile.email;


            // Phone

            document.getElementById(
                "profilePhone"
            ).textContent =
                profile.phone || "-";


            // Department

            document.getElementById(
                "profileDepartment"
            ).textContent =
                profile.department;


            // Role

            document.getElementById(
                "profileRole"
            ).textContent =
                profile.role;


            document.getElementById(
                "profileRoleDetail"
            ).textContent =
                profile.role;


            // Status

            document.getElementById(
                "profileStatus"
            ).textContent =
                profile.status;


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "profileCard"
            ).style.display =
                "block";


        } catch (error) {

            console.error(error);


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            const errorBox =
                document.getElementById(
                    "errorMessage"
                );


            errorBox.textContent =
                "Backend connection failed. Please start the server.";


            errorBox.style.display =
                "block";

        }

    }


    function logout() {

        localStorage.removeItem(
            "aruLoggedInEmployee"
        );

    }


    loadProfile();

</script>

</body>

</html>
