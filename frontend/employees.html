<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARU HRMS - Employees</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 15px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            margin: 0;
        }

        .logo span {
            color: #60a5fa;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-menu a {
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #2563eb;
            color: white;
        }

        .logout {
            margin-top: 25px;
            color: #f87171 !important;
        }

        .main {
            flex: 1;
            padding: 30px;
            box-sizing: border-box;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-header p {
            color: #6b7280;
            margin: 7px 0 0;
        }

        .add-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .search {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #6b7280;
            font-size: 13px;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 4px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .message {
            margin: 15px 0;
            font-weight: bold;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-content {
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-sizing: border-box;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn,
        .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }

        @media (max-width: 700px) {

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
            }

            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .nav-menu a {
                white-space: nowrap;
            }

            .main {
                padding: 18px;
            }

            .page-header {
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                ARU <span>HRMS</span>
            </h2>

        </div>


        <nav class="nav-menu">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a
                href="employees.html"
                class="active"
            >
                👥 Employees
            </a>

            <a href="profile.html">
                👤 Profile
            </a>

            <a href="notifications.html">
                🔔 Notifications
            </a>

            <a href="index.html">
                🏠 Home
            </a>

            <a
                href="login.html"
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="page-header">

            <div>

                <h1>
                    Employees
                </h1>

                <p>
                    Manage employee information
                </p>

            </div>


            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + Add Employee
            </button>

        </div>


        <!-- SEARCH -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Search by name, ID, email or department..."
                oninput="searchEmployees()"
            >

        </div>


        <p
            id="message"
            class="message"
        ></p>


        <!-- TABLE -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>
                            Employee ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="employeeTableBody">

                    <tr>

                        <td colspan="7">
                            Loading employees...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>


<!-- ADD / EDIT MODAL -->

<div
    class="modal"
    id="employeeModal"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Employee
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="employeeForm">


            <div class="form-group">

                <label>
                    Employee ID
                </label>

                <input
                    type="text"
                    id="employeeId"
                    placeholder="EMP004"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="employeeName"
                    placeholder="Enter name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="employeeEmail"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="tel"
                    id="employeePhone"
                    placeholder="Enter phone"
                >

            </div>


            <div class="form-group">

                <label>
                    Department
                </label>

                <select
                    id="employeeDepartment"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    <option value="Human Resources">
                        Human Resources
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Role
                </label>

                <select
                    id="employeeRole"
                    required
                >

                    <option value="">
                        Select Role
                    </option>

                    <option value="HR Manager">
                        HR Manager
                    </option>

                    <option value="Software Developer">
                        Software Developer
                    </option>

                    <option value="Tester">
                        Tester
                    </option>

                    <option value="Accountant">
                        Accountant
                    </option>

                    <option value="Designer">
                        Designer
                    </option>

                    <option value="Intern">
                        Intern
                    </option>

                </select>

            </div>


            <div
                class="form-group"
                id="passwordGroup"
            >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="employeePassword"
                    placeholder="Create password"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="employeeStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Employee
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

            </div>


        </form>

    </div>

</div>


<script>

    const API_URL =
        "http://localhost:3000";


    let employees = [];

    let editMode = false;

    let editingId = null;


    // =========================
    // LOAD EMPLOYEES
    // =========================

    async function loadEmployees() {

        const tableBody =
            document.getElementById(
                "employeeTableBody"
            );


        tableBody.innerHTML = `
            <tr>
                <td colspan="7">
                    Loading employees...
                </td>
            </tr>
        `;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/employees`
                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    "Unable to load employees"
                );

            }


            employees =
                data.employees || [];


            displayEmployees(employees);


        } catch (error) {

            console.error(error);


            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        Backend connection failed.
                    </td>
                </tr>
            `;

        }

    }


    // =========================
    // DISPLAY
    // =========================

    function displayEmployees(list) {

        const tableBody =
            document.getElementById(
                "employeeTableBody"
            );


        tableBody.innerHTML = "";


        if (list.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        No employees found.
                    </td>
                </tr>
            `;

            return;

        }


        list.forEach(employee => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${employee.employee_id}
                </td>

                <td>
                    ${employee.name}
                </td>

                <td>
                    ${employee.email}
                </td>

                <td>
                    ${employee.department}
                </td>

                <td>
                    ${employee.role}
                </td>

                <td>
                    <span class="status">
                        ${employee.status}
                    </span>
                </td>

                <td>

                    <button
                        class="action-btn edit-btn"
                        onclick="editEmployee('${employee.employee_id}')"
                    >
                        Edit
                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="deleteEmployee('${employee.employee_id}')"
                    >
                        Delete
                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });

    }


    // =========================
    // SEARCH
    // =========================

    function searchEmployees() {

        const search =
            document.getElementById(
                "searchInput"
            ).value.toLowerCase();


        const filtered =
            employees.filter(employee =>

                employee.employee_id
                    .toLowerCase()
                    .includes(search)

                ||

                employee.name
                    .toLowerCase()
                    .includes(search)

                ||

                employee.email
                    .toLowerCase()
                    .includes(search)

                ||

                employee.department
                    .toLowerCase()
                    .includes(search)

            );


        displayEmployees(filtered);

    }


    // =========================
    // OPEN ADD
    // =========================

    function openAddModal() {

        editMode = false;

        editingId = null;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Employee";


        document.getElementById(
            "employeeForm"
        ).reset();


        document.getElementById(
            "employeeId"
        ).disabled = false;


        document.getElementById(
            "passwordGroup"
        ).style.display =
            "block";


        document.getElementById(
            "employeeModal"
        ).style.display =
            "flex";

    }


    <!-- Edit Employee Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>

        <h2>Edit Employee</h2>

        <form id="editEmployeeForm">

            <input type="hidden" id="editEmployeeId">

            <label>Employee Name</label>
            <input type="text" id="editName" required>

            <label>Email</label>
            <input type="email" id="editEmail" required>

            <label>Phone</label>
            <input type="text" id="editPhone">

            <label>Department</label>
            <select id="editDepartment" required>
                <option value="">Select Department</option>
                <option value="Human Resources">Human Resources</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Operations">Operations</option>
            </select>

            <label>Role</label>
            <input type="text" id="editRole" required>

            <label>Status</label>
            <select id="editStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>

            <button type="submit" class="btn-primary">
                Update Employee
            </button>

        </form>
    </div>
</div>

<script>

const API_URL = "http://localhost:3000";

let employees = [];


/* =========================
   LOAD EMPLOYEES
========================= */

async function loadEmployees() {

    try {

        const response = await fetch(`${API_URL}/api/employees`);

        const data = await response.json();

        if (data.success) {

            employees = data.employees;

            displayEmployees(employees);

        } else {

            alert("Unable to load employees");

        }

    } catch (error) {

        console.error(error);

        alert("Backend connection failed");

    }

}


/* =========================
   DISPLAY EMPLOYEES
========================= */

function displayEmployees(data) {

    const tableBody = document.getElementById("employeeTableBody");

    tableBody.innerHTML = "";

    if (data.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;">
                    No employees found
                </td>
            </tr>
        `;

        return;
    }


    data.forEach(employee => {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${employee.employee_id}</td>

            <td>${employee.name}</td>

            <td>${employee.email}</td>

            <td>${employee.phone || "-"}</td>

            <td>${employee.department}</td>

            <td>${employee.role}</td>

            <td>
                <span class="status ${employee.status.toLowerCase()}">
                    ${employee.status}
                </span>
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="openEditModal('${employee.employee_id}')">
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteEmployee('${employee.employee_id}')">
                    Delete
                </button>

            </td>

        `;

        tableBody.appendChild(row);

    });

}


/* =========================
   SEARCH EMPLOYEE
========================= */

function searchEmployees() {

    const searchValue =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filteredEmployees = employees.filter(employee =>

        employee.employee_id.toLowerCase().includes(searchValue) ||

        employee.name.toLowerCase().includes(searchValue) ||

        employee.email.toLowerCase().includes(searchValue) ||

        employee.department.toLowerCase().includes(searchValue)

    );


    displayEmployees(filteredEmployees);

}


/* =========================
   OPEN EDIT MODAL
========================= */

function openEditModal(employeeId) {

    const employee =
        employees.find(
            emp => emp.employee_id === employeeId
        );


    if (!employee) {

        alert("Employee not found");

        return;

    }


    document.getElementById("editEmployeeId").value =
        employee.employee_id;

    document.getElementById("editName").value =
        employee.name;

    document.getElementById("editEmail").value =
        employee.email;

    document.getElementById("editPhone").value =
        employee.phone || "";

    document.getElementById("editDepartment").value =
        employee.department;

    document.getElementById("editRole").value =
        employee.role;

    document.getElementById("editStatus").value =
        employee.status;


    document.getElementById("editModal").style.display =
        "flex";

}


/* =========================
   CLOSE EDIT MODAL
========================= */

function closeEditModal() {

    document.getElementById("editModal").style.display =
        "none";

}


/* =========================
   UPDATE EMPLOYEE
========================= */

document
.getElementById("editEmployeeForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const employeeId =
        document.getElementById("editEmployeeId").value;


    const updatedEmployee = {

        name:
            document.getElementById("editName").value,

        email:
            document.getElementById("editEmail").value,

        phone:
            document.getElementById("editPhone").value,

        department:
            document.getElementById("editDepartment").value,

        role:
            document.getElementById("editRole").value,

        status:
            document.getElementById("editStatus").value

    };


    try {

        const response = await fetch(
            `${API_URL}/api/employees/${employeeId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(updatedEmployee)
            }
        );


        const data = await response.json();


        if (data.success) {

            alert("Employee updated successfully ✅");

            closeEditModal();

            loadEmployees();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Unable to update employee");

    }

});


/* =========================
   DELETE EMPLOYEE
========================= */

async function deleteEmployee(employeeId) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this employee?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response = await fetch(
            `${API_URL}/api/employees/${employeeId}`,
            {
                method: "DELETE"
            }
        );


        const data = await response.json();


        if (data.success) {

            alert("Employee deleted successfully 🗑️");

            loadEmployees();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Unable to delete employee");

    }

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("aruLoggedInEmployee");

    window.location.href = "login.html";

}


/* =========================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================= */

window.onclick = function(event) {

    const modal =
        document.getElementById("editModal");


    if (event.target === modal) {

        closeEditModal();

    }

};


/* =========================
   SEARCH EVENT
========================= */

document
.getElementById("searchInput")
.addEventListener("input", searchEmployees);


/* =========================
   LOAD DATA ON PAGE START
========================= */

loadEmployees();

</script>

</body>
</html>
